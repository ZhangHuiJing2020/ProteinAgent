# 数据配置
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  dataset_name: "SPG1_STRSG_Olson_2014"   # ProteinGym 中 GB1 的文件名
  subsample_size: 8000                      # null 表示跑全量
  random_seed: 42

# 数据集划分（按突变位点组合分组）
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  # 测试集包含所有三点突变（训练时未见过的组合）
  include_triple_in_test: true

# 特征工程
features:
  use_blosum: true
  use_onehot: true
  use_physchem: true

# 适应度预测模型
model:
  type: "rf"                 # rf | xgboost | both
  rf:
    n_estimators: 500
    max_depth: 8
    min_samples_split: 10
    min_samples_leaf: 5
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 500
    max_depth: 4
    min_child_weight: 5
    reg_alpha: 0.3
    reg_lambda: 1.5
    subsample: 0.8
    colsample_bytree: 0.7
    learning_rate: 0.05
    random_state: 42
    n_jobs: -1
  save_dir: "results/models"

# 评估指标
metrics:
  topk: 10

# LLM Agent
agent:
  llm_backend: "mock"        # mock | openai | http
  openai:
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    base_url_env: "OPENAI_BASE_URL"
  http:
    url: ""
    headers: {}
  candidate_pool_size: 50    # Mutation Designer 每轮生成候选数
  topk: 10                   # 最终推荐 Top-k
  max_mutations_per_variant: 4

# 虚拟进化实验
experiment:
  rounds: 3
  test_pool_size: 500        # 测试集中作为"虚拟实验池"的子集大小
  methods:
    - random
    - model_only
    - llm_agent
    - llm_agent_kb

# 输出
output:
  results_dir: "results"
  report_dir: "report"
  figures_dir: "results/figures"
